name: Source scaffold checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: python3 tools/check_project.py
      - name: Validate Papyrus script filenames and declarations
        run: python3 tools/check_papyrus_sources.py
